<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Light in the Darkness</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body {
        background: radial-gradient(circle at center, #130e1f 0%, #06040a 100%);
        color: #c5a880;
        font-family: 'Cinzel', 'Georgia', serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #game-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 1280px;
        padding: 10px;
      }
      #game-container {
        position: relative;
        width: 95vw;
        max-width: 1200px;
        aspect-ratio: 16 / 9;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9), 0 0 35px rgba(138, 75, 219, 0.35);
        border: 3px solid #5a3d78;
        border-radius: 6px;
        overflow: hidden;
        background-color: #0b0c10;
      }
      #game-container canvas {
        width: 100% !important;
        height: 100% !important;
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #instructions {
        margin-top: 12px;
        font-size: 13px;
        color: #a89bb8;
        text-align: center;
        letter-spacing: 0.6px;
        background: rgba(20, 14, 33, 0.85);
        padding: 8px 18px;
        border-radius: 4px;
        border: 1px solid #4a3363;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      }
      .key {
        display: inline-block;
        padding: 2px 7px;
        background: #2a1b3d;
        border: 1px solid #784ea8;
        border-radius: 4px;
        color: #ffd700;
        font-family: monospace;
        font-weight: bold;
        font-size: 12px;
      }
      .highlight {
        color: #ffd700;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <div id="game-container"></div>
      <div id="instructions">
        <span class="key">A</span> / <span class="key">D</span> Moverse &nbsp;|&nbsp;
        <span class="key">W</span> / <span class="key">Espacio</span> Saltar &nbsp;|&nbsp;
        <span class="key">J</span> Atacar &nbsp;|&nbsp;
        <span class="key">K</span> Bloqueo Duelista &nbsp;|&nbsp;
        <span class="key">L</span> Esquivar &nbsp;|&nbsp;
        <span class="key">T</span> Lanzar Arma &nbsp;|&nbsp;
        <span class="key">E</span> Recoger Arma &nbsp;|&nbsp;
        <span class="key">M</span> Minijuego Shalem &nbsp;|&nbsp;
        <span class="key">P</span> <span class="highlight">Menú & Arsenal</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
