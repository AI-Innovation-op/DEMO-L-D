<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Light in the Darkness</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body {
        background-color: #0b0c10;
        color: #c5a880;
        font-family: 'Cinzel', 'Georgia', serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      #game-container {
        position: relative;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(100, 70, 150, 0.25);
        border: 2px solid #3c324c;
        border-radius: 4px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #instructions {
        margin-top: 10px;
        font-size: 13px;
        color: #8c8299;
        text-align: center;
        letter-spacing: 0.5px;
      }
      .key {
        display: inline-block;
        padding: 2px 6px;
        background: #1f1b29;
        border: 1px solid #4a3e63;
        border-radius: 3px;
        color: #e2d4f0;
        font-family: monospace;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="instructions">
      <span class="key">A</span> / <span class="key">D</span> o Flechas: Moverse &nbsp;|&nbsp;
      <span class="key">W</span> / <span class="key">Espacio</span>: Saltar &nbsp;|&nbsp;
      <span class="key">J</span>: Atacar (Combos) &nbsp;|&nbsp;
      <span class="key">K</span>: Bloquear / Duelista &nbsp;|&nbsp;
      <span class="key">L</span>: Esquivar &nbsp;|&nbsp;
      <span class="key">T</span>: Lanzar Arma (Desarme Voluntario) &nbsp;|&nbsp;
      <span class="key">E</span>: Recoger Arma &nbsp;|&nbsp;
      <span class="key">M</span>: Minijuego Shalem (cuando Level Up esté listo)
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
